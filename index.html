:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: einspaltige App (max. 560px), feste Tab-Leiste unten, Bearbeiten als Bottom-Sheet.
   Ruhige grünlich-graue Neutraltöne, Petrol als Akzent, Kilometerstände in Mono wie ein Zählwerk. */
:root {
  --bg: #f1f3f2; --surface: #ffffff; --surface-2: #e8ecea; --fg: #17201d; --muted: #5b6662; --line: #d6dcd9;
  --accent: #0f5e6e; --accent-fg: #ffffff; --accent-soft: #dceef0;
  --biz: #16805c; --priv: #4a78d6; --comm: #b77a12;
  --bad: #b4441e; --bad-bg: #fbece5; --part: #6d6a52; --part-bg: #efeee4;
  --shadow: 0 1px 2px rgba(15, 30, 28, .06), 0 4px 16px rgba(15, 30, 28, .06);
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101416; --surface: #171d20; --surface-2: #20282b; --fg: #e5ebe9; --muted: #96a29e; --line: #2b3538;
    --accent: #5bb8c6; --accent-fg: #06252b; --accent-soft: #173438;
    --biz: #2e9e78; --priv: #5c8ae6; --comm: #b98a2a;
    --bad: #e7835e; --bad-bg: #33201a; --part: #c2bd94; --part-bg: #2a2a21;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101416; --surface: #171d20; --surface-2: #20282b; --fg: #e5ebe9; --muted: #96a29e; --line: #2b3538;
  --accent: #5bb8c6; --accent-fg: #06252b; --accent-soft: #173438;
  --biz: #2e9e78; --priv: #5c8ae6; --comm: #b98a2a;
  --bad: #e7835e; --bad-bg: #33201a; --part: #c2bd94; --part-bg: #2a2a21;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
h2, h3, h4 { text-wrap: balance; margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.center { text-align: center; justify-content: center; }
.num, .tc-km, .big, .mid, .clock, .odo input, .kv dd, table { font-variant-numeric: tabular-nums; }
code { font-family: var(--mono); font-size: .9em; }

.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)); }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 6px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -.01em; }
.brand-mark { font-family: var(--mono); font-size: 11px; font-weight: 600; background: var(--fg); color: var(--bg); border-radius: 4px; padding: 3px 5px; letter-spacing: .04em; }
.topbar-veh { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.error-bar { background: var(--bad-bg); color: var(--bad); border-radius: var(--r); padding: 10px 12px; font-size: 14px; display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 8px; }

.screen { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.screen-title { font-size: 24px; font-weight: 600; letter-spacing: -.015em; }
.period-title { font-size: 18px; font-weight: 600; }
.sec-title { font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: var(--r); border: 1px solid transparent; cursor: pointer; font-weight: 500; background: none; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--accent); color: var(--accent-fg); }
.btn-ghost { border-color: var(--line); background: var(--surface); }
.btn-ghost:hover:not(:disabled) { border-color: var(--muted); }
.btn-danger-ghost { border-color: var(--line); background: var(--surface); color: var(--bad); }
.btn-danger-ghost.armed, .link-btn.danger.armed { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.grow { flex: 1; }
.link-btn { background: none; border: none; color: var(--accent); padding: 6px 2px; cursor: pointer; font-size: 14px; font-weight: 500; text-align: left; }
.link-btn.danger { color: var(--bad); border-radius: 6px; padding-inline: 6px; }
.link-btn.muted { color: var(--muted); }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border: none; background: none; border-radius: 50%; cursor: pointer; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--surface-2); }

.btn-start, .btn-stop { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 76px; border-radius: 16px; border: none; cursor: pointer; font-size: 21px; font-weight: 600; letter-spacing: -.01em; box-shadow: var(--shadow); }
.btn-start { background: var(--accent); color: var(--accent-fg); }
.btn-stop { background: var(--fg); color: var(--bg); min-height: 88px; }
.btn-start svg, .btn-stop svg { width: 26px; height: 26px; }
.btn-start:active, .btn-stop:active { transform: scale(.99); }

/* Segmented */
.seg { display: flex; background: var(--surface-2); border-radius: var(--r); padding: 3px; gap: 3px; }
.seg button { flex: 1; min-height: 40px; border: none; background: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px; min-width: 0; }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.seg-lg button { min-height: 56px; font-size: 16px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--chip, var(--muted)); flex: none; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 2px 9px 2px 6px; }
.status > span { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-size: 11px; font-weight: 700; }
.status-bad { background: var(--bad-bg); color: var(--bad); }
.status-bad > span { background: var(--bad); color: var(--surface); }
.status-part { background: var(--part-bg); color: var(--part); }
.status-part > span { background: var(--part); color: var(--surface); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 7px; margin-top: 2px; }

/* Banner & notices */
.active-banner, .notice { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 15px; }
.active-banner { border-color: var(--accent); background: var(--accent-soft); }
.arrow { margin-left: auto; font-size: 22px; color: var(--muted); line-height: 1; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--biz); flex: none; box-shadow: 0 0 0 0 var(--biz); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--biz) 60%, transparent); } 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; border: 1px solid var(--line); }
.tile-total { padding: 16px; }
.tile-muted { background: transparent; border-style: dashed; }
.tile-label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.big { font-family: var(--mono); font-size: 38px; font-weight: 500; letter-spacing: -.02em; line-height: 1.1; }
.mid { font-family: var(--mono); font-size: 24px; font-weight: 500; letter-spacing: -.02em; }
.tile-sub { font-size: 14px; color: var(--muted); }
.tile-sub strong { color: var(--fg); font-weight: 600; }
.tile-warn { font-size: 13px; color: var(--bad); }
.sharebar { display: flex; gap: 2px; height: 8px; margin-top: 8px; border-radius: 4px; overflow: hidden; }
.sharebar span { display: block; min-width: 3px; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.empty h3 { font-size: 18px; }
.empty p { margin: 0; color: var(--muted); }

/* Trip cards */
.trip-list { display: flex; flex-direction: column; gap: 8px; }
.trip-card { display: flex; flex-direction: column; gap: 4px; text-align: left; width: 100%; padding: 12px 14px 12px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; position: relative; overflow: hidden; }
.trip-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--chip); }
.trip-card.q-incomplete { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.trip-card:hover { border-color: var(--muted); }
.tc-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.tc-time { font-size: 15px; font-weight: 500; }
.tc-km { font-family: var(--mono); font-size: 17px; font-weight: 500; white-space: nowrap; }
.tc-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--muted); align-items: center; }
.tc-meta .badge { color: var(--fg); }
.tc-route { font-size: 14px; overflow-wrap: anywhere; }
.tc-money { font-size: 14px; color: var(--muted); }
.tc-money strong { color: var(--fg); }
.tc-missing { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 13px; color: var(--muted); margin-top: 2px; }
.day { display: flex; flex-direction: column; gap: 8px; }
.day-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; padding-top: 6px; flex-wrap: wrap; }
.day-head .muted { font-weight: 400; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll-x { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip.removable { cursor: default; padding-right: 4px; }
.chip.removable button { border: none; background: none; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; color: var(--muted); font-size: 18px; }

/* Drive */
.drive { gap: 18px; padding-top: 16px; }
.drive-live { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.live-label { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--biz); }
.clock { font-family: var(--mono); font-size: 56px; font-weight: 500; letter-spacing: -.03em; line-height: 1; }
.live-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
.live-facts div { display: flex; flex-direction: column; }
.live-facts dt { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.live-facts dd { margin: 0; font-family: var(--mono); font-size: 17px; }

/* Form */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label { font-size: 13px; font-weight: 500; color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); }
input:not([type="file"]), select, textarea { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px 12px; font-size: 16px; }
textarea { min-height: 0; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.odo { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.odo:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.odo input { border: none; box-shadow: none !important; font-family: var(--mono); font-size: 19px; letter-spacing: .02em; background: transparent; }
.odo span { padding: 0 12px 0 0; color: var(--muted); font-size: 14px; }
.odo.lg input { font-size: 30px; min-height: 64px; letter-spacing: .04em; }
.odo.sm input { font-size: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } .grid3 > :first-child { grid-column: 1 / -1; } }
.distance { font-size: 15px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }
.distance strong { font-family: var(--mono); font-weight: 600; }
.distance.err { background: var(--bad-bg); color: var(--bad); }
.inline-form { display: flex; gap: 8px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.subform { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: var(--r); background: var(--surface-2); }
.warn-text { color: var(--bad); margin: 0; }

/* Sheet */
.sheet-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 13, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 600px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 12px); background: var(--bg); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 6px 4px max(18px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 19px; font-weight: 600; }
.sheet-body { overflow-y: auto; padding: 14px max(18px, env(safe-area-inset-right, 0px)) 18px max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; overscroll-behavior: contain; }
.sheet-foot { display: flex; gap: 10px; padding: 12px max(18px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
.lead { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 15px; }
.form-sec { display: flex; flex-direction: column; gap: 10px; }
.form-sec h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.prows { display: flex; flex-direction: column; gap: 10px; }
.prow { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.prow-main { display: grid; grid-template-columns: minmax(0, 1fr) 120px 44px; gap: 8px; align-items: end; }
.prow-tools { display: flex; flex-wrap: wrap; gap: 0 14px; align-items: center; }
.prow-amount { margin-left: auto; font-size: 14px; font-variant-numeric: tabular-nums; }
.calc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.calc-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.calc-table td { padding: 5px 0; vertical-align: top; }
.calc-table td.num { text-align: right; padding-left: 8px; white-space: nowrap; }
.calc-table td:nth-child(2) { color: var(--muted); }
.calc-table tr.total td { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 600; font-size: 16px; }
.quality { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; padding: 12px; border-radius: var(--r); background: var(--bad-bg); }
.quality.partial { background: var(--part-bg); }
.quality p { margin: 0; font-size: 14px; }

/* Panels & stats */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel h3 { font-size: 16px; font-weight: 600; }
.panel h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 0 0; }
.panel p { margin: 0; }
.kv { display: flex; flex-direction: column; margin: 0; }
.kv div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.kv div:last-child { border-bottom: none; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-weight: 500; }
.purposes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.purposes li { display: flex; justify-content: space-between; gap: 8px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 10.5px; font-family: var(--font); }
.chart .axis-sel { fill: var(--fg); font-weight: 600; }
.chart .bar { cursor: pointer; }
.chart .bar:not(.sel) rect:not([fill="transparent"]) { opacity: .78; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart-detail { font-size: 14px; margin-top: 6px; min-height: 21px; }
.table-view { margin-top: 8px; font-size: 14px; }
.table-view summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 6px 6px 6px 0; border-bottom: 1px solid var(--line); }
td { padding: 6px 6px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th.num, td.num { text-align: right; }
.rates tr.current td { font-weight: 500; }
.hbars { display: flex; flex-direction: column; gap: 5px; }
.hbar { display: grid; grid-template-columns: 82px minmax(0, 1fr) 28px; gap: 8px; align-items: center; font-size: 13px; }
.hbar-label { color: var(--muted); white-space: nowrap; }
.hbar-track { height: 14px; background: var(--surface-2); border-radius: 0 4px 4px 0; overflow: hidden; }
.hbar-track span { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.hbar-val { text-align: right; font-variant-numeric: tabular-nums; }
.people { list-style: none; margin: 0; padding: 0; }
.people li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.people li:last-child { border-bottom: none; }
.plan { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; background: var(--surface); border-top: 1px solid var(--line); padding: 4px max(4px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
.tabbar button { flex: 1; max-width: 112px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: none; background: none; cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 500; min-width: 0; }
.tabbar button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tabbar button.on { color: var(--accent); }
.tabbar .tab-drive svg { background: var(--accent); color: var(--accent-fg); border-radius: 50%; padding: 7px; width: 38px; height: 38px; margin-top: -10px; box-shadow: var(--shadow); }
.tabbar .tab-drive.live svg { background: var(--biz); animation: pulse 2s infinite; }

@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

/* ===== Version 1.1: optische Aufwertung ===== */
:root {
  --meter-bg: #13211f; --meter-fg: #eef4f1; --meter-dim: #6f8681; --meter-cell: #1d302d; --meter-line: #2a403c;
  --money-bg: #dcefe7; --money-fg: #0d4a36;
  --r: 14px;
  --shadow-lg: 0 2px 4px rgba(15, 30, 28, .05), 0 12px 32px rgba(15, 30, 28, .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --meter-bg: #0b1112; --meter-fg: #e9f1ee; --meter-dim: #56706a; --meter-cell: #152022; --meter-line: #24363a;
    --money-bg: #133027; --money-fg: #9fe0c4; --shadow-lg: 0 2px 6px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  --meter-bg: #0b1112; --meter-fg: #e9f1ee; --meter-dim: #56706a; --meter-cell: #152022; --meter-line: #24363a;
  --money-bg: #133027; --money-fg: #9fe0c4; --shadow-lg: 0 2px 6px rgba(0, 0, 0, .4);
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.topbar { padding-block: 12px 2px; }
.topbar-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sync-pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync-cloud .sync-dot { background: var(--biz); }
.sync-syncing .sync-dot, .sync-connecting .sync-dot { background: var(--priv); animation: pulse 1.6s infinite; }
.sync-offline .sync-dot, .sync-local .sync-dot { background: var(--bad); }
.sync-offline, .sync-local { color: var(--bad); }
@media (max-width: 400px) { .topbar-veh { display: none; } }

.hello { display: flex; flex-direction: column; gap: 2px; padding-top: 6px; }
.hello h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.025em; line-height: 1.1; }
.hello-date { margin: 0; font-size: 14px; color: var(--muted); }

.btn-start { justify-content: flex-start; gap: 16px; padding: 0 20px; min-height: 84px; border-radius: 20px; box-shadow: var(--shadow-lg);
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 78%, #000)); }
.start-icon { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--accent-fg) 18%, transparent); flex: none; }
.start-icon svg { width: 22px; height: 22px; margin-left: 3px; }
.start-text { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
.start-text strong { font-size: 21px; font-weight: 600; }
.start-text small { font-size: 13px; font-weight: 400; opacity: .82; }
.notice { border-radius: var(--r); }
.notice small { font-size: 13px; }

/* Zählwerk-Karte */
.meter { background: var(--meter-bg); color: var(--meter-fg); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-lg); }
.meter-head, .meter-foot { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--meter-dim); flex-wrap: wrap; }
.meter-head span:first-child { color: var(--meter-fg); font-weight: 600; font-size: 14px; }
.meter-warn { font-size: 13px; color: var(--bad); }
.meter .sharebar { margin-top: 0; height: 6px; gap: 3px; }
.meter .sharebar span { border-radius: 3px; }
.odo-digits { display: flex; gap: 4px; }
.odo-digits span { flex: 1; max-width: 54px; aspect-ratio: 3 / 4; display: grid; place-items: center; background: var(--meter-cell); border: 1px solid var(--meter-line); border-radius: 8px;
  font-family: var(--mono); font-size: clamp(30px, 10vw, 44px); font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums;
  background-image: linear-gradient(180deg, rgba(255,255,255,.05), transparent 45%, rgba(0,0,0,.18)); }

.odo-digits.sm span { max-width: 34px; font-size: 22px; border-radius: 6px; }
.drive-live .clock { font-size: 64px; color: var(--meter-fg); }
.drive-live .live-label { color: var(--meter-fg); }

/* Kilometergeld */
.money { background: var(--money-bg); color: var(--money-fg); border-radius: var(--r); padding: 16px 18px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.money-label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; opacity: .85; }
.money-value { font-family: var(--mono); font-size: 32px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.money-sub { display: flex; flex-direction: column; align-items: flex-end; font-size: 13px; gap: 1px; opacity: .9; }
.money-warn { color: var(--bad); font-weight: 600; }

.type-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.type-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; overflow: hidden; }
.type-tile::after { content: ""; position: absolute; left: 12px; right: 12px; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--chip); }
.type-name { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.type-km { font-family: var(--mono); font-size: 22px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.type-km small { font-size: 13px; color: var(--muted); font-family: var(--font); letter-spacing: 0; }
.type-n { font-size: 12.5px; color: var(--muted); }

/* Fahrt-Karte mit Zeitspalte */
.trip-card { flex-direction: row; gap: 14px; padding: 12px 14px; border-radius: var(--r); box-shadow: 0 1px 2px rgba(15, 30, 28, .04); }
.trip-card::before { display: none; }
.tc-when { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 48px; flex: none; font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tc-when span:nth-of-type(2), .tc-when > span:first-child:not(.tc-date) { color: var(--fg); font-weight: 500; }
.tc-date { font-size: 11px; font-weight: 600; color: var(--chip) !important; letter-spacing: .02em; }
.tc-line { width: 2px; flex: 1; min-height: 10px; border-radius: 2px; background: var(--chip); opacity: .7; }
.tc-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tc-km { font-size: 20px; }
.tc-km small { font-size: 13px; color: var(--muted); font-family: var(--font); }
.tc-route { font-size: 15px; font-weight: 500; }
.tc-money { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; background: var(--money-bg); color: var(--money-fg); border-radius: 6px; padding: 0 6px; }
.day-head { padding-top: 10px; }

/* Panels, Formulare, Sheet */
.panel, .tile, .empty, .calc, .prow { border-radius: var(--r); }
.panel { box-shadow: 0 1px 2px rgba(15, 30, 28, .04); }
.screen-title { font-size: 28px; letter-spacing: -.025em; }
.seg { border-radius: 12px; }
.seg button { border-radius: 9px; }
.sheet { border-radius: 22px 22px 0 0; }
.sheet-head { padding-top: 14px; position: relative; }
.sheet-head::before { content: ""; position: absolute; top: 6px; left: 50%; width: 38px; height: 4px; margin-left: -19px; border-radius: 2px; background: var(--line); }
.odo.lg { background: var(--meter-bg); border-color: var(--meter-line); border-radius: 14px; }
.odo.lg input { color: var(--meter-fg); font-size: 34px; min-height: 72px; letter-spacing: .08em; padding-left: 16px; }
.odo.lg input::placeholder { color: var(--meter-dim); letter-spacing: .02em; font-size: 22px; }
.odo.lg span { color: var(--meter-dim); padding-right: 16px; }
.odo.follow { background: var(--surface-2); border-style: dashed; }
.follow-tag { font-size: 13px; color: var(--biz); font-weight: 500; padding: 6px 0; }
.btn-stop { border-radius: 20px; min-height: 92px; box-shadow: var(--shadow-lg); }

/* Schwebende Navigation */
.tabbar { left: 50%; right: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(560px, calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  border: 1px solid var(--line); border-radius: 22px; padding: 6px; box-shadow: var(--shadow-lg);
  background: color-mix(in srgb, var(--surface) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.tabbar button { border-radius: 16px; padding: 7px 0; }
.tabbar button.on:not(.tab-drive) { background: var(--accent-soft); }
.tabbar .tab-drive svg { margin-top: -18px; width: 44px; height: 44px; padding: 10px; border: 3px solid var(--bg); box-sizing: content-box; }
.app { padding-block: 0 calc(104px + env(safe-area-inset-bottom, 0px)); }
.type-name { white-space: normal; font-size: 12.5px; line-height: 1.2; }
.reminder { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--bad-bg); color: var(--fg); font-size: 14px; margin-bottom: 4px; }
.reminder span { flex: 1; min-width: 0; }

/* ===== Version 2: Kosten & hochwertigere Gestaltung =====
   Ruhigere Flächen, feine Haarlinien, geschichtete Schatten; Formulare als gruppierte Karten wie in iOS. */
:root {
  --bg: #eef1f0; --surface: #ffffff; --surface-2: #f2f5f4; --line: #dfe5e3; --hair: rgba(16, 36, 32, .08);
  --tone-fuel-bg: #f6ecd8; --tone-fuel-fg: #8a5a06; --tone-fix-bg: #e2eafb; --tone-fix-fg: #2c58b6;
  --tone-svc-bg: #dcefe7; --tone-svc-fg: #11704f; --tone-misc-bg: #eceeed; --tone-misc-fg: #4f5b57;
  --glow: rgba(15, 94, 110, .10);
  --card-shadow: 0 1px 1px rgba(16, 36, 32, .04), 0 2px 6px rgba(16, 36, 32, .04), 0 8px 24px -12px rgba(16, 36, 32, .10);
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1113; --surface: #151b1e; --surface-2: #1c2427; --line: #27333a; --hair: rgba(255, 255, 255, .07);
    --tone-fuel-bg: #33270f; --tone-fuel-fg: #e2b35a; --tone-fix-bg: #18253f; --tone-fix-fg: #8eb0f2;
    --tone-svc-bg: #12302a; --tone-svc-fg: #6fd1a8; --tone-misc-bg: #20292c; --tone-misc-fg: #a9b6b2;
    --glow: rgba(91, 184, 198, .10); --card-shadow: 0 1px 2px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  --bg: #0d1113; --surface: #151b1e; --surface-2: #1c2427; --line: #27333a; --hair: rgba(255, 255, 255, .07);
  --tone-fuel-bg: #33270f; --tone-fuel-fg: #e2b35a; --tone-fix-bg: #18253f; --tone-fix-fg: #8eb0f2;
  --tone-svc-bg: #12302a; --tone-svc-fg: #6fd1a8; --tone-misc-bg: #20292c; --tone-misc-fg: #a9b6b2;
  --glow: rgba(91, 184, 198, .10); --card-shadow: 0 1px 2px rgba(0, 0, 0, .35);
}
body { background: radial-gradient(120% 60% at 50% -10%, var(--glow), transparent 60%) no-repeat, var(--bg); background-attachment: fixed; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }

/* Kopfzeile */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; padding-block: 10px; margin-inline: -4px; padding-inline: 4px;
  background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.brand { border: none; background: none; padding: 0; cursor: pointer; text-align: left; color: var(--fg); }
.brand-mark { font-size: 12px; padding: 5px 6px; border-radius: 7px; background: var(--meter-bg); color: var(--meter-fg); box-shadow: inset 0 -2px 0 var(--biz); }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; font-size: 15px; }
.brand-text small { font-size: 12px; color: var(--muted); font-weight: 500; }
.icon-btn.gear { width: 40px; height: 40px; color: var(--fg); }
.icon-btn.gear.on { background: var(--accent-soft); color: var(--accent); }

/* Karten einheitlich */
.panel, .tile, .trip-card, .type-tile, .notice, .empty, .item, .car-card, .quick, .prow, .calc { border: 1px solid var(--hair); box-shadow: var(--card-shadow); }
.panel { border-radius: 18px; padding: 16px; }
.meter { border-radius: 22px; position: relative; overflow: hidden; }
.meter::before { content: ""; position: absolute; inset: -40% -20% auto auto; width: 70%; height: 120%; background: radial-gradient(closest-side, rgba(110, 200, 170, .16), transparent); pointer-events: none; }
.meter > * { position: relative; }
.sec-title { font-size: 12.5px; letter-spacing: .09em; }
.screen { gap: 16px; }
.screen-title { font-size: 30px; font-weight: 600; }

/* Segmentsteuerung */
.seg { background: var(--surface-2); border: 1px solid var(--hair); border-radius: 14px; padding: 4px; }
.seg button { border-radius: 10px; font-size: 13.5px; }
.seg button.on { box-shadow: 0 1px 2px rgba(16, 36, 32, .12), 0 2px 8px -2px rgba(16, 36, 32, .12); font-weight: 600; }

/* Schnellaktionen */
.quick-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: -4px; }
.quick { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 8px; border-radius: 14px; background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px; color: var(--fg); }
.quick .cat-ic { width: 30px; height: 30px; border-radius: 9px; }
.quick:active, .item:active, .trip-card:active, .car-card:active { transform: scale(.985); }

/* Kategorie-Symbole */
.cat-ic { width: 38px; height: 38px; border-radius: 12px; display: inline-grid; place-items: center; flex: none; }
.tone-fuel { background: var(--tone-fuel-bg); color: var(--tone-fuel-fg); }
.tone-fix { background: var(--tone-fix-bg); color: var(--tone-fix-fg); }
.tone-svc { background: var(--tone-svc-bg); color: var(--tone-svc-fg); }
.tone-misc { background: var(--tone-misc-bg); color: var(--tone-misc-fg); }

/* Fahrzeugkarte im Überblick */
.car-card { display: flex; flex-direction: column; gap: 12px; width: 100%; padding: 16px; border-radius: 18px; background: var(--surface); cursor: pointer; text-align: left; color: var(--fg); }
.car-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--muted); }
.car-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
.car-stats div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.car-stats small { font-size: 12px; color: var(--muted); }
.car-stats strong { font-family: var(--mono); font-weight: 500; font-size: 20px; letter-spacing: -.02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.car-stats em { font-style: normal; font-family: var(--font); font-size: 12px; color: var(--muted); }
@media (min-width: 520px) { .car-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.empty-car { flex-direction: row; align-items: center; gap: 12px; }
.empty-car span { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.empty-car small { color: var(--muted); font-size: 13px; }

/* Hero-Karten im Kostenbereich */
.hero-sum { font-family: var(--mono); font-size: clamp(34px, 11vw, 46px); font-weight: 500; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.hero-sum small { font-family: var(--font); font-size: 15px; letter-spacing: 0; color: var(--meter-dim); font-weight: 500; }
.hero-note { margin: 0; color: var(--meter-fg); opacity: .85; font-size: 14px; }
.hero-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-top: 12px; border-top: 1px solid var(--meter-line); }
.hero-grid div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hero-grid span { font-size: 12px; color: var(--meter-dim); }
.hero-grid strong { font-family: var(--mono); font-weight: 500; font-size: 15.5px; color: var(--meter-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.vs { display: flex; flex-direction: column; gap: 8px; }
.vs p { margin: 0; font-size: 13.5px; color: var(--meter-dim); }
.vs p strong { color: var(--meter-fg); font-weight: 600; }
.vs-bar { position: relative; height: 8px; border-radius: 4px; background: var(--meter-cell); }
.vs-fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: linear-gradient(90deg, var(--biz), #59c39b); }
.vs-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--meter-fg); }
.spark { width: 100%; height: 56px; display: block; overflow: visible; }
.spark-line { fill: none; stroke: #e2b35a; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark-area { fill: rgba(226, 179, 90, .12); stroke: none; }
.spark-avg { stroke: var(--meter-dim); stroke-width: 1; stroke-dasharray: 3 4; }
.spark-dot { fill: #e2b35a; stroke: var(--meter-bg); stroke-width: 2; }
.km-basis { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }

/* Kalkulation */
.calc-list { gap: 4px; }
.calc-list > .row-between { margin-bottom: 6px; }
.calc-group { padding: 10px 0; border-top: 1px solid var(--hair); display: flex; flex-direction: column; gap: 8px; }
.calc-group:first-of-type { border-top: none; }
.calc-row { display: flex; align-items: center; gap: 10px; }
.calc-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: none; background: none; padding: 0; cursor: pointer; text-align: left; color: var(--fg); }
.calc-label { flex: 1; min-width: 0; display: flex; flex-direction: column; font-weight: 500; font-size: 15px; }
.calc-label small { font-weight: 400; font-size: 12.5px; color: var(--muted); }
.calc-amt { font-family: var(--mono); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chev { color: var(--muted); transition: transform .15s; display: grid; }
.chev.open { transform: rotate(90deg); }
.calc-bar { height: 4px; border-radius: 2px; background: var(--surface-2); margin-left: 84px; overflow: hidden; }
.calc-bar span { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.calc-group.off .calc-label, .calc-group.off .calc-amt, .calc-item.off .calc-label, .calc-item.off .calc-amt { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.calc-group.off .calc-bar span, .calc-group.off .cat-ic { opacity: .35; }
.calc-items { display: flex; flex-direction: column; margin-left: 34px; padding: 4px 0 0 12px; border-left: 2px solid var(--hair); gap: 2px; }
.calc-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; }
.check { position: relative; display: inline-grid; place-items: center; width: 26px; height: 26px; flex: none; cursor: pointer; }
.check input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.check .box { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; color: transparent; background: var(--surface); transition: background .12s, border-color .12s; }
.check input:checked + .box { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.check input:indeterminate + .box { background: var(--accent-soft); border-color: var(--accent); color: transparent; box-shadow: inset 0 0 0 5px var(--surface); }
.check input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Listen (Tankungen, Ausgaben) */
.item-list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 16px; background: var(--surface); cursor: pointer; text-align: left; color: var(--fg); }
.item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.item-title { font-weight: 500; font-size: 15px; overflow-wrap: anywhere; }
.item-sub { font-size: 13px; color: var(--muted); }
.item-amt { font-family: var(--mono); font-weight: 500; font-size: 16px; text-align: right; white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; }
.item-amt small { font-family: var(--font); font-size: 11.5px; color: var(--muted); font-weight: 400; }
.l100 { margin-top: 3px; font-size: 12px; font-weight: 600; color: var(--tone-fuel-fg); background: var(--tone-fuel-bg); border-radius: 6px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
.l100.bad { color: var(--bad); background: var(--bad-bg); }
.group { display: flex; flex-direction: column; gap: 10px; }
.quick-cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.quick-cat { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 16px; border: 1px dashed var(--line); background: transparent; cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--fg); text-align: center; }
.quick-cat:hover { border-style: solid; background: var(--surface); }

/* Rechner */
.calc-card { gap: 14px; }
.calc-card-head { display: flex; gap: 12px; align-items: flex-start; }
.calc-card-head h3 { margin-bottom: 2px; }
.result { padding: 14px 16px; border-radius: 14px; background: var(--meter-bg); color: var(--meter-fg); min-height: 64px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.result .muted { color: var(--meter-dim); font-size: 14px; }
.result-main { font-family: var(--mono); font-size: 30px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.result-main small { font-family: var(--font); font-size: 14px; color: var(--meter-dim); letter-spacing: 0; }
.result-sub { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--meter-dim); }

/* Formulare: gruppierte Karten */
.sheet { background: var(--bg); }
.sheet-body { gap: 14px; }
.form-sec { background: var(--surface); border: 1px solid var(--hair); border-radius: 16px; padding: 14px; gap: 12px; }
.form-sec.calc { padding: 14px; }
.sheet-foot { background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
input:not([type="file"]):not([type="checkbox"]), select, textarea { background: var(--surface-2); border-color: transparent; border-radius: 10px; }
.odo { background: var(--surface-2); border-color: transparent; border-radius: 10px; }
.odo.follow { background: transparent; border: 1px dashed var(--line); }
.odo.follow input { color: var(--muted); }
.odo.lg { border-radius: 16px; }
input:focus, select:focus, textarea:focus, .odo:focus-within { background: var(--surface); border-color: var(--accent); }
.fuel-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 380px) { .fuel-grid { grid-template-columns: 1fr 1fr; } .fuel-grid > :first-child { grid-column: 1 / -1; } }
.cat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cat-pick { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 14px; border: 1.5px solid var(--hair); background: var(--surface); cursor: pointer; font-size: 12px; font-weight: 500; color: var(--fg); text-align: center; line-height: 1.2; }
.cat-pick .cat-ic { width: 32px; height: 32px; border-radius: 10px; }
.cat-pick.on { border-color: var(--accent); background: var(--accent-soft); }

/* Schalter */
.toggle-row { display: flex; align-items: center; gap: 12px; cursor: pointer; position: relative; padding: 2px 0; }
.toggle-text { flex: 1; display: flex; flex-direction: column; font-size: 15px; font-weight: 500; }
.toggle-text small { font-size: 12.5px; color: var(--muted); font-weight: 400; }
.toggle-row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch { width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .18s; }
.toggle-row input:checked + .switch { background: var(--biz); }
.toggle-row input:checked + .switch::after { transform: translateX(18px); }
.toggle-row input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Navigation */
.tabbar { border-radius: 24px; }
.tabbar button.on:not(.tab-drive) { background: none; position: relative; }
.tabbar button.on:not(.tab-drive)::after { content: ""; position: absolute; bottom: 2px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.btn-primary { box-shadow: 0 1px 2px rgba(15, 94, 110, .2), inset 0 1px 0 rgba(255, 255, 255, .12); }
.btn-ghost { border-color: var(--hair); box-shadow: 0 1px 2px rgba(16, 36, 32, .05); }
